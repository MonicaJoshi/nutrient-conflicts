# .config/opencode/AGENTS.md APPLIED
# NutrientConflictsEvaluation Project AGENTS.md APPLIED
# PYTHON SKILL APPLIED
#
# Nutrient Conflicts Evaluation runtime configuration.
# Every tunable value used by the program lives here. Values may reference other
# keys or environment variables as ${NAME:default}.
#
# The USDA and reference folders are EXTERNAL and READ ONLY. The program copies the
# small reference CSVs into reference.dir (a writable work area under data/) and
# never writes to reference.source.dir or dataset.root.

app.name=NutrientConflicts
app.version=1.0.0
app.disclaimer=Nutrient interactions are reported from published reference charts for informational use only. This is not medical advice and is not a substitute for guidance from a qualified health professional.

# ---------------------------------------------------------------- dataset (read only)
dataset.root=projects/ds/nutrient-conflicts/brandData
dataset.zip.pattern=FoodData_Central_*csv_*.zip
dataset.preferred.zip=FoodData_Central_csv_2026-10-29.zip
dataset.file.branded_food=branded_food.csv
dataset.file.food=food.csv
dataset.file.food_nutrient=food_nutrient.csv
dataset.file.nutrient=nutrient.csv
dataset.csv.encoding=utf-8
# true = also read food_nutrient.csv so every pair can show quantities and %DV
dataset.ingest.include_measured=true
dataset.ingest.progress_every=250000

# ---------------------------------------------------------------- reference data (read only source)
reference.source.dir=projects/ds/nutrient-conflicts/referenceData
# writable work area: the source CSVs are copied here on first use
reference.dir=data/reference
reference.file.interactions=nutrient_interactions.csv
reference.file.interactions.seed=nutrient_interactions.seed.csv
reference.file.crosswalk=ingredient_nutrient_map.csv
reference.file.aliases=nutrient_aliases.csv
reference.file.dv=dv_reference.csv
reference.name.map=data/reference/nutrient_name_map.csv
reference.conflict.policy=context_dependent
reference.matrix.transcription=reference/sources/biological_conflicts_matrix.csv

# ---------------------------------------------------------------- reference sources
# reference-data-1: Minich vitamin/mineral chart, parsed from the PDF text layer.
reference.source.vitamin_mineral.pdf=${reference.source.dir}/MET2557-Vitamin-Mineral-Interactions-Chart_IPAD.pdf
reference.source.vitamin_mineral.source_file=data/reference/sources/vitamin_mineral_interactions.csv
reference.source.vitamin_mineral.output_file=data/reference/derived/Vitamin-Mineral-Interactions.csv
reference.source.vitamin_mineral.report_file=data/reference/derived/Vitamin-Mineral-Interactions.md
reference.source.vitamin_mineral.label=Minich vitamin-mineral interactions chart (MET2557)

# reference-data-2: Biological conflicts matrix image, validated against the reviewed
# transcription (the PNG has no text layer, so OCR is not used at build time).
reference.source.biological.image=${reference.source.dir}/BiologicalConflicts-Matrix-AvsB.png
reference.source.biological.source_file=${reference.matrix.transcription}
reference.source.biological.output_file=data/reference/derived/BiologicalConflicts-Matrix.csv
reference.source.biological.report_file=data/reference/derived/BiologicalConflicts-Matrix.md
reference.source.biological.label=Biological conflicts matrix (research summary)

# chart table geometry (fractions of page width, vertical tolerances, sanity checks)
reference.pdf.page=0
reference.pdf.column.boundaries=0.196,0.392,0.556
reference.pdf.row.tolerance.points=2.0
reference.pdf.row.max.offset.points=14.0
reference.pdf.min.rows=20
reference.pdf.min.populated.rows=15
reference.pdf.marker.text=high doses

reference.derived.dir=data/reference/derived
reference.manifest.file=data/reference/derived/reference-manifest.json
reference.crosscheck.file=data/reference/derived/reference-crosscheck.json
# false = the merged knowledge base refuses to drop a pair it used to contain
reference.kb.allow.removals=false
reference.evidence.rank=inferred:0,chart:1,clinical:2
reference.strength.rank=weak:0,moderate:1,strong:2

# ---------------------------------------------------------------- persistence
store.dir=data/store
store.db.file=nutrientconflicts.sqlite
store.jsonl.file=branded_foods.jsonl.gz
store.schema.version=1
store.auto.build=true
# warm the in-process cache from the persisted JSONL on startup (bounded)
store.warm.entries=2000

cache.dir=data/cache
cache.enabled=true
# memory | disk | redis  (redis is forward looking; see readme)
cache.backend=disk
cache.l1.max_entries=4096
cache.ttl.seconds=86400
cache.redis.host=localhost
cache.redis.port=6379
cache.redis.db=0
cache.redis.password=
cache.redis.ttl.seconds=86400
cache.redis.prefix=nutrientconflicts:

ingest.batch.size=20000

# ---------------------------------------------------------------- ingredient parsing
# Prefixes stripped before splitting (case insensitive).
parse.ignore.prefixes=INGREDIENTS:,MADE FROM:,CONTAINS LESS THAN 2% OF:,CONTAINS 2% OR LESS OF:,CONTAINS 2% OR LESS:,CONCENTRATED JUICES OF,CONCENTRATED JUICE OF
parse.separators=,;&
parse.group.open=([
parse.group.close=)]
parse.drop.numeric.groups=true
# Functional labels and qualifier phrases that are not ingredients.
parse.qualifier.tokens=PRESERVATIVES,PRESERVATIVE,PRESERVATIVES AND COLOR,EMULSIFIER,EMULSIFIERS,COLOR,COLORS,COLOUR,COLOURS,FLAVOR,FLAVORS,FLAVOUR,ANTIOXIDANT,ANTI CAKING AGENT,ARTIFICIAL FLAVOR,NATURAL FLAVOR,FOR COLOR,AS A PRESERVATIVE,TEXTURIZER,STABILIZER,THICKENER,FROM CONCENTRATE,TO PROTECT,TO PROTECT FLAVOR,PROCESSING AID,ADDED TO PROTECT FLAVOR
parse.strip.chars=.;"*
parse.max.phrases.per.food=400
parse.max.phrase.length=80

# ---------------------------------------------------------------- analysis
# A pair is active only when both nutrients reach this share of the daily value
# (or when measured data is unavailable and the pair is present in the ingredients).
analysis.min.dv.percent=5.0
analysis.include.additives.in.score=false
analysis.include.context.dependent=true
analysis.quantity.unknown.activates=true
analysis.quantity.unknown.in.score=false
analysis.unknown.quantity.pressure=0.5
analysis.pressure.cap=1.0
analysis.net.neutral.band=0.1
analysis.strength.weights=strong:1.0,moderate:0.6,weak:0.3
analysis.evidence.weights=clinical:1.0,chart:0.7,inferred:0.4
analysis.additives.source.kind=additive
analysis.inferred.nutrients=PHYTATE,OXALATE
analysis.server.default.sort=net_desc
analysis.top.findings=25

# ---------------------------------------------------------------- brand conflicts scan
conflicts.output.dir=data/results
conflicts.csv.file=Brand-Nutrient-Conflicts.csv
conflicts.report.file=Brand-Nutrient-Conflicts.md
conflicts.manifest.file=Brand-Nutrient-Conflicts.manifest.json
conflicts.cache.namespace=brand_conflicts
conflicts.auto.build=true
conflicts.include.context.dependent=true
conflicts.quantity.max.dv.percent=1000
conflicts.sample.products=5
conflicts.report.top.brands=20

# ---------------------------------------------------------------- summary and warning wording
product.summary.conflict.text={antagonistic} antagonistic and {synergistic} synergistic nutrient combination(s) identified for {brand} ({product}); {context_dependent} combination(s) depend on dose.
product.summary.none.text=No conflicting nutrient combinations identified for {brand} ({product}).
product.warning.text=Antagonistic nutrient combinations were identified for {brand} ({product}): {pairs}. Check these results with a registered dietitian, together with the quantities involved, before changing the diet or adding supplements.
conflicts.summary.conflict.text={antagonistic} antagonistic and {synergistic} synergistic nutrient combination(s) identified for {brand}; {context_dependent} combination(s) depend on dose.
conflicts.summary.none.text=No conflicting nutrient combinations identified for {brand}.
conflicts.warning.text=Antagonistic nutrient combinations were identified for {brand}: {pairs}. Check these results with a registered dietitian, together with the quantities involved, before changing the diet or adding supplements.
conflicts.next.steps=Review the flagged pairs with a registered dietitian|Adjust portion sizes and meal timing (for example, separate iron-rich and calcium-rich foods)|Do not eliminate nutrients; adjust supplement doses only with professional guidance

# ---------------------------------------------------------------- API
api.host=127.0.0.1
api.port=8077
api.request.timeout.seconds=30
api.cors.origins=*
api.max.page.size=200
api.default.page.size=25
api.prefix=/api/v1

# ---------------------------------------------------------------- CLI
cli.default.format=table
cli.page.size=25
cli.show.provenance=false

# ---------------------------------------------------------------- GUI (Fastify + React)
gui.title=Nutrient Conflicts Evaluation
gui.host=127.0.0.1
gui.port=5173
gui.dist.dir=gui/dist
gui.api.base.url=http://127.0.0.1:${api.port}
gui.npm.command=npm

# ---------------------------------------------------------------- logging
log.level=INFO
log.format=%(asctime)s %(levelname)-7s %(name)s: %(message)s
